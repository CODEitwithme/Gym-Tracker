<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="Train with purpose. Track your real progress. Build your stronger self with Forge Fit."
    />
    <meta name="theme-color" content="#f7f6f2" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Forge / Fit" />
    <meta property="og:title" content="Forge / Fit — Training &amp; Nutrition Log" />
    <meta
      property="og:description"
      content="Train with purpose. Track your real progress. Local-first workout and nutrition logging with zero subscriptions."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Forge / Fit — Training &amp; Nutrition Log" />
    <meta
      name="twitter:description"
      content="Train with purpose. Track your real progress. Local-first workout and nutrition logging with zero subscriptions."
    />
    <script>
      try {
        const savedTheme = localStorage.getItem("gym-tracker-theme");
        const systemPrefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        document.documentElement.dataset.theme =
          savedTheme === "light" || savedTheme === "dark"
            ? savedTheme
            : systemPrefersDark
              ? "dark"
              : "light";
      } catch {
        document.documentElement.dataset.theme = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches
          ? "dark"
          : "light";
      }
    </script>
    <title>Forge / Fit — Training log</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
